services:
  - type: web
    name: spc-dtr-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: spc_online_dtr
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
